<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRI MentorLink – Mes Matchs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/match.css') }}" />
  <style>
    .sidebar-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .mentor-avatar{width:52px;height:52px;border-radius:50%;background:#ede9fe;display:flex;align-items:center;
      justify-content:center;font-weight:700;color:#7c3aed;font-size:1.1rem;flex-shrink:0;overflow:hidden}
    .mentor-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <a href="/dashboard" class="sidebar-logo">
      <img src="/static/img/logo-mentorlink.png" alt="IFRI MentorLink" style="width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0">
      <div><div class="sidebar-logo-text">IFRI MentorLink</div><div class="sidebar-logo-sub">UAC – Bénin</div></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Menu</div>
      <a href="/dashboard" class="nav-item-link"><i class="bi bi-grid-1x2 nav-icon"></i> Tableau de bord</a>
      <a href="/annonces"  class="nav-item-link"><i class="bi bi-megaphone nav-icon"></i> Annonces</a>
      <div class="sidebar-section-label">Social</div>
      <a href="/messages"  class="nav-item-link"><i class="bi bi-chat-dots nav-icon"></i> Messagerie</a>
      <a href="/matching"  class="nav-item-link active"><i class="bi bi-people nav-icon"></i> Mes matchs</a>
      <a href="/planning"  class="nav-item-link"><i class="bi bi-calendar-week nav-icon"></i> Planning</a>
      <div class="sidebar-section-label">Compte</div>
      <a href="/profil"    class="nav-item-link"><i class="bi bi-person-circle nav-icon"></i> Profil</a>
      <a href="#" id="logoutBtn" class="nav-item-link" style="color:#ef4444"><i class="bi bi-box-arrow-left nav-icon"></i> Déconnexion</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/profil" class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">?</div>
        <div>
          <div class="sidebar-user-name" id="sidebarName">…</div>
          <div class="sidebar-user-role" id="sidebarRole"></div>
        </div>
      </a>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <header class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="topbar-hamburger" id="hamburgerBtn"><i class="bi bi-list"></i></button>
      <span class="topbar-title">Mes matchs & Suggestions</span>
    </div>
  </header>

  <main class="main-content">

    <!-- Suggestions -->
    <h5 class="fw-bold mb-3">Suggestions de mentors</h5>
    <div id="suggestionsGrid" class="row g-3 mb-5">
      <div class="col-12 text-center py-4 text-muted">
        <span class="spinner-border spinner-border-sm me-2"></span>Chargement…
      </div>
    </div>

    <!-- Demandes reçues -->
    <h5 class="fw-bold mb-3 mt-5">Demandes reçues</h5>
    <div id="demandesGrid" class="row g-3">
      <div class="col-12 text-center py-4 text-muted">
        <span class="spinner-border spinner-border-sm me-2"></span>Chargement…
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (!localStorage.getItem('access_token')) window.location.href = '/login';

    const authH = () => ({
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${localStorage.getItem('access_token')}`
    });

    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function avatarHtml(photo, prenom, nom, bg='#ede9fe', color='#7c3aed') {
      if (photo) return `<img src="${photo}" alt="avatar">`;
      return `${escHtml((prenom||'?')[0])}${escHtml((nom||'?')[0])}`;
    }

    function showToast(msg, type='info') {
      const t = document.createElement('div');
      t.className = `alert alert-${type} position-fixed bottom-0 end-0 m-3`;
      t.style.cssText = 'z-index:9999;min-width:260px;border-radius:12px;font-size:0.88rem';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    document.getElementById('hamburgerBtn').addEventListener('click', () =>
      document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('sidebarOverlay').addEventListener('click', () =>
      document.getElementById('sidebar').classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', e => {
      e.preventDefault(); localStorage.clear(); window.location.href = '/login';
    });

    // Charger sidebar
    fetch('/users/me', { headers: authH() }).then(r => r.json()).then(u => {
      const sa  = document.getElementById('sidebarAvatar');
      const ini = ((u.prenom||'?')[0]+(u.nom||'?')[0]).toUpperCase();
      if (u.photo) sa.innerHTML = `<img src="${u.photo}" alt="avatar">`;
      else sa.textContent = ini;
      document.getElementById('sidebarName').textContent = `${u.prenom} ${u.nom}`;
      document.getElementById('sidebarRole').textContent = `${u.niveau} – ${u.filiere}`;
    });

    // ── Suggestions ──────────────────────────────────────────
    async function loadSuggestions() {
      try {
        const res  = await fetch('/matching/suggestions', { headers: authH() });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const grid = document.getElementById('suggestionsGrid');

        if (!list.length) {
          grid.innerHTML = `<p class="text-muted py-3 col-12 text-center">
            Aucune suggestion.<br>
            <a href="/profil" class="link-violet">Ajoutez des lacunes dans votre profil</a> pour trouver des mentors.
          </p>`;
          return;
        }

        grid.innerHTML = list.map(u => `
          <div class="col-sm-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm" style="border-radius:16px">
              <div class="card-body">
                <div class="d-flex align-items-center gap-3 mb-3">
                  <div class="mentor-avatar">
                    ${u.photo ? `<img src="${u.photo}" alt="avatar">` : `${escHtml((u.prenom||'?')[0])}${escHtml((u.nom||'?')[0])}`}
                  </div>
                  <div>
                    <div class="fw-bold">${escHtml(u.prenom)} ${escHtml(u.nom)}</div>
                    <div style="font-size:0.78rem;color:#6b7280">${escHtml(u.niveau)} – ${escHtml(u.filiere)}</div>
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <span style="font-size:0.78rem;color:#6b7280">Compatibilité</span>
                  <span style="font-weight:700;color:#7c3aed">${u.score}%</span>
                </div>
                <div style="background:#ede9fe;border-radius:999px;height:6px;overflow:hidden;margin-bottom:1rem">
                  <div style="width:${Math.min(u.score,100)}%;height:100%;background:linear-gradient(90deg,#a78bfa,#7c3aed);border-radius:999px;transition:width 1s"></div>
                </div>
                <div class="mb-2">
                  ${(u.competences||[]).map(c => `
                    <span class="badge me-1" style="background:#d1fae5;color:#059669;font-size:0.7rem">
                      ${escHtml(typeof c === 'object' ? c.nom_competence : c)}
                    </span>`).join('')}
                </div>
                <button class="btn btn-sm w-100 btn-mentorlink" onclick="createMatch(${u.id_user},${u.score})">
                  <i class="bi bi-person-plus me-1"></i>Envoyer une demande
                </button>
              </div>
            </div>
          </div>`).join('');
      } catch(e) {
        document.getElementById('suggestionsGrid').innerHTML =
          '<p class="text-muted text-center py-3 col-12">Erreur lors du chargement des suggestions.</p>';
      }
    }

    async function createMatch(mentorId, score) {
      try {
        const res  = await fetch('/matching/', {
          method: 'POST', headers: authH(),
          body: JSON.stringify({ mentor_id: mentorId, score })
        });
        const data = await res.json();
        if (res.ok) {
          showToast('✅ Demande envoyée ! En attente de réponse du mentor.', 'success');
          loadSuggestions();
        } else if (res.status === 409) {
          showToast('Une demande existe déjà avec ce mentor.', 'warning');
        } else {
          showToast(data.error || 'Erreur.', 'danger');
        }
      } catch(e) { showToast('Erreur réseau.', 'danger'); }
    }

    // ── Demandes reçues ────────────────────────────────────
    async function loadDemandes() {
      try {
        const res  = await fetch('/matching/mes-demandes', { headers: authH() });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const grid = document.getElementById('demandesGrid');

        if (!list.length) {
          grid.innerHTML = '<p class="text-muted py-3 col-12 text-center">Aucune demande reçue pour l\'instant.</p>';
          return;
        }

        grid.innerHTML = list.map(m => `
          <div class="col-sm-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm" style="border-radius:16px">
              <div class="card-body">
                <div class="d-flex align-items-center gap-3 mb-3">
                  <div class="mentor-avatar" style="background:#fef3c7;color:#d97706">
                    ${m.mentore.photo ? `<img src="${m.mentore.photo}" alt="avatar">` : `${escHtml((m.mentore.prenom||'?')[0])}${escHtml((m.mentore.nom||'?')[0])}`}
                  </div>
                  <div>
                    <div class="fw-bold">${escHtml(m.mentore.prenom)} ${escHtml(m.mentore.nom)}</div>
                    <div style="font-size:0.78rem;color:#6b7280">${escHtml(m.mentore.niveau)} – ${escHtml(m.mentore.filiere)}</div>
                  </div>
                </div>
                <div class="d-flex justify-content-between mb-3">
                  <span class="badge" style="background:${m.statut==='ACCEPTE'?'#d1fae5':m.statut==='REFUSE'?'#fee2e2':'#ede9fe'};
                    color:${m.statut==='ACCEPTE'?'#065f46':m.statut==='REFUSE'?'#991b1b':'#7c3aed'}">
                    ${m.statut==='ACCEPTE'?'✅ Accepté':m.statut==='REFUSE'?'❌ Refusé':'⏳ En attente'}
                  </span>
                  <small class="text-muted">${new Date(m.date_matching).toLocaleDateString('fr-FR')}</small>
                </div>
                ${m.statut === 'EN_ATTENTE' ? `
                  <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-success w-50" onclick="repondre(${m.id_matching},'ACCEPTE')">
                      <i class="bi bi-check2 me-1"></i>Accepter
                    </button>
                    <button class="btn btn-sm btn-outline-danger w-50" onclick="repondre(${m.id_matching},'REFUSE')">
                      <i class="bi bi-x me-1"></i>Refuser
                    </button>
                  </div>` : ''}
                ${m.id_conversation && m.statut==='ACCEPTE' ? `
                  <a href="/messages?conv=${m.id_conversation}" class="btn btn-sm btn-mentorlink w-100 mt-2">
                    <i class="bi bi-chat-dots me-1"></i>Ouvrir la conversation
                  </a>` : ''}
              </div>
            </div>
          </div>`).join('');
      } catch(e) {
        document.getElementById('demandesGrid').innerHTML =
          '<p class="text-muted text-center py-3 col-12">Erreur lors du chargement des demandes.</p>';
      }
    }

    async function repondre(id_matching, statut) {
      try {
        const res = await fetch(`/matching/${id_matching}/statut`, {
          method: 'PUT', headers: authH(),
          body: JSON.stringify({ statut })
        });
        if (res.ok) {
          showToast(statut==='ACCEPTE' ? '✅ Demande acceptée !' : '❌ Demande refusée.', statut==='ACCEPTE'?'success':'warning');
          loadDemandes();
        } else {
          const d = await res.json();
          showToast(d.error || 'Erreur.', 'danger');
        }
      } catch(e) { showToast('Erreur réseau.', 'danger'); }
    }
    window.repondre = repondre;
    window.createMatch = createMatch;

    loadSuggestions();
    loadDemandes();
  </script>
</body>
</html>
