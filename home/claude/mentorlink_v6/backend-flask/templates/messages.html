<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRI MentorLink – Messagerie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/messenger.css') }}" />
  <style>
    .chat-bubble{max-width:72%;padding:0.6rem 1rem;border-radius:18px;margin-bottom:0.5rem;font-size:0.88rem;line-height:1.55;word-break:break-word}
    .chat-bubble.me{background:#7c3aed;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
    .chat-bubble.other{background:#f3f4f6;color:#111827;margin-right:auto;border-bottom-left-radius:4px}
    #chatMessages{height:calc(100vh - 310px);overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:2px}
    .conv-item{cursor:pointer;padding:0.75rem;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:0.5rem;transition:background 0.15s;text-decoration:none;display:block}
    .conv-item:hover,.conv-item.active{background:#ede9fe}
    .conv-avatar{width:42px;height:42px;min-width:42px;border-radius:50%;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7c3aed;font-size:0.9rem;overflow:hidden;flex-shrink:0}
    .conv-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .sidebar-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <a href="/dashboard" class="sidebar-logo">
      <img src="/static/img/logo-mentorlink.png" alt="IFRI MentorLink" style="width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0">
      <div><div class="sidebar-logo-text">IFRI MentorLink</div><div class="sidebar-logo-sub">UAC – Bénin</div></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Menu</div>
      <a href="/dashboard" class="nav-item-link"><i class="bi bi-grid-1x2 nav-icon"></i> Tableau de bord</a>
      <a href="/annonces"  class="nav-item-link"><i class="bi bi-megaphone nav-icon"></i> Annonces</a>
      <div class="sidebar-section-label">Social</div>
      <a href="/messages"  class="nav-item-link active"><i class="bi bi-chat-dots nav-icon"></i> Messagerie</a>
      <a href="/matching"  class="nav-item-link"><i class="bi bi-people nav-icon"></i> Mes matchs</a>
      <a href="/planning"  class="nav-item-link"><i class="bi bi-calendar-week nav-icon"></i> Planning</a>
      <div class="sidebar-section-label">Compte</div>
      <a href="/profil"    class="nav-item-link"><i class="bi bi-person-circle nav-icon"></i> Profil</a>
      <a href="#" id="logoutBtn" class="nav-item-link" style="color:#ef4444"><i class="bi bi-box-arrow-left nav-icon"></i> Déconnexion</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/profil" class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">?</div>
        <div><div class="sidebar-user-name" id="sidebarName">…</div></div>
      </a>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <header class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="topbar-hamburger" id="hamburgerBtn"><i class="bi bi-list"></i></button>
      <span class="topbar-title">Messagerie</span>
    </div>
  </header>

  <main class="main-content">
    <div class="row g-3" style="height:calc(100vh - 120px)">

      <!-- Liste conversations -->
      <div class="col-md-4 col-lg-3">
        <h6 class="fw-bold mb-3">Conversations</h6>
        <div id="convList">
          <p class="text-muted text-center py-3">
            <span class="spinner-border spinner-border-sm me-2"></span>Chargement…
          </p>
        </div>
      </div>

      <!-- Zone chat -->
      <div class="col-md-8 col-lg-9">
        <div id="chatZone" style="display:none;flex-direction:column;height:100%;background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden">
          <div style="padding:1rem 1.25rem;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px">
            <div class="conv-avatar" id="chatAvatar">?</div>
            <strong id="chatPartnerName" style="font-size:0.95rem">Conversation</strong>
          </div>
          <div id="chatMessages" class="flex-grow-1"></div>
          <div style="padding:0.75rem;border-top:1px solid #e5e7eb;display:flex;gap:8px">
            <input type="text" id="msgInput" class="form-control" placeholder="Votre message…"
              style="border-radius:999px" />
            <button class="btn btn-mentorlink" id="btnSend" style="border-radius:999px;padding:0 1.2rem">
              <i class="bi bi-send-fill"></i>
            </button>
          </div>
        </div>
        <div id="chatEmpty" class="d-flex align-items-center justify-content-center h-100 text-muted flex-column gap-2">
          <i class="bi bi-chat-dots" style="font-size:3rem;opacity:0.3"></i>
          <span>Sélectionnez une conversation</span>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (!localStorage.getItem('access_token')) window.location.href = '/login';

    const authH = () => ({
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${localStorage.getItem('access_token')}`
    });

    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('hamburgerBtn').addEventListener('click', () =>
      document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('sidebarOverlay').addEventListener('click', () =>
      document.getElementById('sidebar').classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', e => {
      e.preventDefault(); localStorage.clear(); window.location.href = '/login';
    });

    let currentUser  = null;
    let currentConvId = null;
    let currentPartner = null;
    let pollInterval = null;
    let lastMsgCount = 0;

    // Charger l'utilisateur
    fetch('/users/me', { headers: authH() }).then(r => r.json()).then(u => {
      currentUser = u;
      const sa  = document.getElementById('sidebarAvatar');
      const ini = ((u.prenom||'?')[0]+(u.nom||'?')[0]).toUpperCase();
      if (u.photo) sa.innerHTML = `<img src="${u.photo}" alt="avatar">`;
      else sa.textContent = ini;
      document.getElementById('sidebarName').textContent = `${u.prenom} ${u.nom}`;
      // Ouvrir une conv depuis URL (?conv=ID)
      const convIdFromUrl = new URLSearchParams(window.location.search).get('conv');
      if (convIdFromUrl) {
        openConversation(parseInt(convIdFromUrl), 'Conversation', null);
      }
    });

    // ── Charger les conversations ──────────────────────────
    async function loadConversations() {
      try {
        const res  = await fetch('/matching/mes-conversations', { headers: authH() });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const div  = document.getElementById('convList');

        if (!list.length) {
          div.innerHTML = `
            <div class="alert alert-info" style="font-size:0.82rem">
              <i class="bi bi-info-circle me-1"></i>
              Aucune conversation active.<br>
              <a href="/matching" class="alert-link">Trouver des mentors →</a>
            </div>`;
          return;
        }

        div.innerHTML = list.map(c => `
          <div class="conv-item${currentConvId===c.id_conversation?' active':''}"
               onclick="openConversation(${c.id_conversation},'${escHtml(c.partenaire.prenom)} ${escHtml(c.partenaire.nom)}','${c.partenaire.photo||''}')">
            <div class="d-flex align-items-center gap-2">
              <div class="conv-avatar">
                ${c.partenaire.photo ? `<img src="${c.partenaire.photo}" alt="avatar">` : `${escHtml((c.partenaire.prenom||'?')[0])}${escHtml((c.partenaire.nom||'?')[0])}`}
              </div>
              <div style="overflow:hidden">
                <div style="font-weight:600;font-size:0.88rem;color:#111">${escHtml(c.partenaire.prenom)} ${escHtml(c.partenaire.nom)}</div>
                <div style="font-size:0.72rem;color:#6b7280">${escHtml(c.partenaire.niveau||'')} – ${escHtml(c.partenaire.filiere||'')}</div>
              </div>
            </div>
          </div>`).join('');
      } catch(e) {
        document.getElementById('convList').innerHTML =
          '<p class="text-muted text-center" style="font-size:0.82rem">Erreur de chargement.</p>';
      }
    }

    // ── Ouvrir une conversation ────────────────────────────
    function openConversation(convId, partnerName, partnerPhoto) {
      currentConvId  = convId;
      currentPartner = { name: partnerName, photo: partnerPhoto };
      lastMsgCount   = 0;

      document.getElementById('chatPartnerName').textContent = partnerName;
      const chatAvatar = document.getElementById('chatAvatar');
      if (partnerPhoto) chatAvatar.innerHTML = `<img src="${partnerPhoto}" alt="avatar">`;
      else chatAvatar.textContent = (partnerName||'?').substring(0,2).toUpperCase();

      document.getElementById('chatZone').style.display  = 'flex';
      document.getElementById('chatEmpty').style.display = 'none';

      // Marquer active
      document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
      if (pollInterval) clearInterval(pollInterval);
      loadMessages();
      pollInterval = setInterval(loadMessages, 3000);
    }
    window.openConversation = openConversation;

    // ── Charger les messages ───────────────────────────────
    async function loadMessages() {
      if (!currentConvId) return;
      try {
        const res  = await fetch(`/messages/${currentConvId}`, { headers: authH() });
        if (!res.ok) return;
        const msgs = await res.json();

        // Ne redessiner que si de nouveaux messages
        if (msgs.length === lastMsgCount) return;
        lastMsgCount = msgs.length;

        const box = document.getElementById('chatMessages');
        const atBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 60;

        box.innerHTML = msgs.map(m => {
          const isMe = m.expediteur_id === currentUser?.id_user;
          return `
            <div class="d-flex ${isMe?'justify-content-end':'justify-content-start'}">
              <div class="chat-bubble ${isMe?'me':'other'}">
                ${escHtml(m.contenu)}
                <div style="font-size:0.65rem;opacity:0.6;text-align:right;margin-top:3px">
                  ${new Date(m.date_envoi).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
                </div>
              </div>
            </div>`;
        }).join('');

        if (atBottom || lastMsgCount <= 1) box.scrollTop = box.scrollHeight;
      } catch(e) {}
    }

    // ── Envoyer un message ─────────────────────────────────
    async function sendMessage() {
      const input   = document.getElementById('msgInput');
      const btnSend = document.getElementById('btnSend');
      const contenu = input.value.trim();
      if (!contenu || !currentConvId) return;

      input.value    = '';
      input.disabled = true;
      btnSend.disabled = true;

      try {
        const res = await fetch(`/messages/${currentConvId}`, {
          method: 'POST', headers: authH(),
          body: JSON.stringify({ contenu })
        });
        if (res.ok) {
          lastMsgCount = 0; // forcer le rechargement
          await loadMessages();
        }
      } catch(e) {}
      input.disabled = false;
      btnSend.disabled = false;
      input.focus();
    }

    document.getElementById('btnSend').addEventListener('click', sendMessage);
    document.getElementById('msgInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    loadConversations();
  </script>
</body>
</html>
