<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRI MentorLink – Messagerie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/messenger.css') }}" />
  <style>
    .sidebar{position:fixed;top:0;left:0;width:252px;height:100vh;background:#fff;border-right:1px solid #e8e4f0;display:flex;flex-direction:column;z-index:1040;transition:transform .3s ease}
    .sidebar-logo{display:flex;align-items:center;gap:.85rem;padding:1.1rem 1.35rem;border-bottom:1px solid #e8e4f0;text-decoration:none;min-height:62px}
    .sidebar-logo:hover{opacity:.85}
    .sidebar-logo-img{width:36px;height:36px;min-width:36px;max-width:36px;border-radius:10px;object-fit:cover;flex-shrink:0;display:block}
    .sidebar-logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;color:#0f1923;line-height:1.1}
    .sidebar-logo-sub{font-size:.65rem;color:#7c7495}
    .sidebar-nav{flex:1;overflow-y:auto;padding:1rem .875rem;scrollbar-width:none}
    .sidebar-nav::-webkit-scrollbar{display:none}
    .sidebar-section-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#b0a8c8;padding:.5rem .75rem .3rem;margin-top:.6rem}
    .nav-item-link{display:flex;align-items:center;gap:.75rem;padding:.55rem .75rem;border-radius:10px;text-decoration:none;color:#7c7495;font-size:.875rem;font-weight:500;transition:all .15s;margin-bottom:2px;position:relative}
    .nav-item-link:hover{background:#f5f2fd;color:#7c3aed;transform:translateX(2px)}
    .nav-item-link.active{background:#ede9f8;color:#7c3aed;font-weight:600}
    .nav-item-link.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:#7c3aed;border-radius:0 3px 3px 0}
    .nav-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
    .sidebar-footer{border-top:1px solid #e8e4f0;padding:.875rem 1.25rem}
    .sidebar-user{display:flex;align-items:center;gap:.7rem;text-decoration:none;padding:.4rem .5rem;border-radius:10px;transition:background .15s}
    .sidebar-user:hover{background:#f5f2fd}
    .sidebar-avatar{width:34px;height:34px;border-radius:50%;background:#ede9f8;border:2px solid #e8e4f0;display:flex;align-items:center;justify-content:center;color:#7c3aed;font-weight:700;font-size:.8rem;flex-shrink:0;overflow:hidden}
    .sidebar-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .sidebar-user-name{font-size:.83rem;font-weight:600;color:#0f1923;line-height:1.2}
    .sidebar-user-role{font-size:.7rem;color:#7c7495}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,10,30,.4);backdrop-filter:blur(2px);z-index:1039}
    .topbar{position:fixed;top:0;left:252px;right:0;height:62px;background:#fff;border-bottom:1px solid #e8e4f0;display:flex;align-items:center;padding:0 1.75rem;z-index:1030}
    .topbar-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;color:#0f1923}
    .topbar-hamburger{display:none;background:none;border:none;font-size:1.3rem;color:#0f1923;cursor:pointer;padding:.25rem}
    .main-content{margin-left:252px;margin-top:62px;padding:1.5rem;min-height:calc(100vh - 62px);background:#f3f1f9}
    .btn-mentorlink{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff !important;border:none;border-radius:10px;padding:.5rem 1rem;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;justify-content:center}
    .btn-mentorlink:hover{color:#fff !important;transform:translateY(-1px)}
    .btn-mentorlink:disabled{opacity:.6;cursor:not-allowed;transform:none}
    /* Chat */
    .chat-wrap{display:flex;height:calc(100vh - 110px);background:#fff;border-radius:18px;border:1px solid #e8e4f0;overflow:hidden;box-shadow:0 2px 10px rgba(79,46,140,.08)}
    .conv-list{width:280px;min-width:280px;border-right:1px solid #e8e4f0;display:flex;flex-direction:column;overflow:hidden}
    .conv-list-title{padding:1rem 1.2rem;font-weight:700;font-size:.95rem;color:#0f1923;border-bottom:1px solid #e8e4f0;font-family:'Syne',sans-serif}
    .conv-list-body{flex:1;overflow-y:auto;padding:.5rem}
    .conv-item{display:flex;align-items:center;gap:.75rem;padding:.7rem .8rem;border-radius:12px;cursor:pointer;transition:background .15s;text-decoration:none;margin-bottom:3px}
    .conv-item:hover{background:#f5f2fd}
    .conv-item.active{background:#ede9f8}
    .conv-avatar{width:42px;height:42px;min-width:42px;border-radius:50%;background:#ede9f8;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7c3aed;font-size:.9rem;overflow:hidden;flex-shrink:0}
    .conv-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .conv-name{font-weight:600;font-size:.88rem;color:#0f1923;line-height:1.2}
    .conv-sub{font-size:.72rem;color:#7c7495}
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .chat-header{padding:.9rem 1.2rem;border-bottom:1px solid #e8e4f0;display:flex;align-items:center;gap:.75rem;min-height:62px}
    .chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.4rem;background:#faf9fe}
    .bubble{max-width:72%;padding:.6rem 1rem;border-radius:18px;font-size:.875rem;line-height:1.55;word-break:break-word}
    .bubble.me{background:#7c3aed;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
    .bubble.other{background:#fff;color:#111;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #e8e4f0}
    .bubble-time{font-size:.65rem;opacity:.65;margin-top:.25rem;text-align:right}
    .chat-footer{padding:.75rem 1rem;border-top:1px solid #e8e4f0;display:flex;gap:.5rem;align-items:center;background:#fff}
    .chat-input{flex:1;border:1.5px solid #e8e4f0;border-radius:24px;padding:.5rem 1rem;font-size:.875rem;outline:none;font-family:inherit;resize:none;height:42px;line-height:1.4}
    .chat-input:focus{border-color:#7c3aed}
    .btn-send{width:42px;height:42px;border-radius:50%;background:#7c3aed;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;flex-shrink:0}
    .btn-send:hover{background:#6d28d9;transform:scale(1.05)}
    .btn-send:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b0a8c8;gap:.75rem}
    .no-conv{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#b0a8c8;text-align:center;padding:2rem}
    @media(max-width:991.98px){
      .sidebar{transform:translateX(-252px)}
      .sidebar.open{transform:translateX(0);box-shadow:0 8px 32px rgba(79,46,140,.2)}
      .sidebar-overlay.open{display:block}
      .topbar{left:0}
      .topbar-hamburger{display:flex}
      .main-content{margin-left:0;padding:.75rem}
      .conv-list{width:220px;min-width:220px}
    }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <a href="/dashboard" class="sidebar-logo">
    <img src="/static/img/logo-mentorlink.png" alt="IFRI MentorLink" class="sidebar-logo-img">
    <div>
      <div class="sidebar-logo-text">IFRI MentorLink</div>
      <div class="sidebar-logo-sub">UAC – Bénin</div>
    </div>
  </a>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Menu</div>
    <a href="/dashboard" class="nav-item-link"><i class="bi bi-grid-1x2 nav-icon"></i> Tableau de bord</a>
    <a href="/annonces"  class="nav-item-link"><i class="bi bi-megaphone nav-icon"></i> Annonces</a>
    <div class="sidebar-section-label">Social</div>
    <a href="/messages"  class="nav-item-link active"><i class="bi bi-chat-dots nav-icon"></i> Messagerie</a>
    <a href="/matching"  class="nav-item-link"><i class="bi bi-people nav-icon"></i> Mes matchs</a>
    <a href="/planning"  class="nav-item-link"><i class="bi bi-calendar-week nav-icon"></i> Planning</a>
    <div class="sidebar-section-label">Compte</div>
    <a href="/profil"    class="nav-item-link"><i class="bi bi-person-circle nav-icon"></i> Profil</a>
    <a href="#" id="logoutBtn" class="nav-item-link" style="color:#ef4444">
      <i class="bi bi-box-arrow-left nav-icon"></i> Déconnexion
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="/profil" class="sidebar-user">
      <div class="sidebar-avatar" id="sidebarAvatar">?</div>
      <div>
        <div class="sidebar-user-name" id="sidebarName">…</div>
        <div class="sidebar-user-role" id="sidebarRole"></div>
      </div>
    </a>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<header class="topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="topbar-hamburger" id="hamburgerBtn"><i class="bi bi-list"></i></button>
    <span class="topbar-title">Messagerie</span>
  </div>
</header>

<main class="main-content">
  <div class="chat-wrap">

    <!-- Liste conversations -->
    <div class="conv-list">
      <div class="conv-list-title">
        <i class="bi bi-chat-dots me-2" style="color:#7c3aed"></i>Conversations
      </div>
      <div class="conv-list-body" id="convList">
        <div class="text-center text-muted py-4" style="font-size:.85rem">
          <span class="spinner-border spinner-border-sm me-2"></span>Chargement…
        </div>
      </div>
    </div>

    <!-- Zone chat -->
    <div class="chat-area" id="chatArea">
      <!-- Header -->
      <div class="chat-header" id="chatHeader" style="display:none">
        <div class="conv-avatar" id="chatAvatar">?</div>
        <div>
          <div style="font-weight:700;font-size:.92rem" id="chatName">Conversation</div>
          <div style="font-size:.72rem;color:#7c7495" id="chatSub"></div>
        </div>
      </div>

      <!-- Messages -->
      <div class="chat-messages" id="chatMessages" style="display:none"></div>

      <!-- Input -->
      <div class="chat-footer" id="chatFooter" style="display:none">
        <input type="text" id="msgInput" class="chat-input"
               placeholder="Écrire un message… (Entrée pour envoyer)" />
        <button class="btn-send" id="btnSend" title="Envoyer">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>

      <!-- Vide -->
      <div class="chat-empty" id="chatEmpty">
        <i class="bi bi-chat-dots" style="font-size:3rem;opacity:.25"></i>
        <span style="font-size:.9rem">Sélectionnez une conversation</span>
        <a href="/matching" style="font-size:.82rem;color:#7c3aed">
          Trouver des mentors →
        </a>
      </div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (!localStorage.getItem('access_token')) window.location.href = '/login';

function authH() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + localStorage.getItem('access_token')
  };
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Sidebar
document.getElementById('hamburgerBtn').addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', function() {
  document.getElementById('sidebar').classList.remove('open');
});
document.getElementById('logoutBtn').addEventListener('click', function(e) {
  e.preventDefault(); localStorage.clear(); window.location.href = '/login';
});

// État
var currentUser   = null;
var currentConvId = null;
var pollTimer     = null;
var lastMsgId     = 0;

// Charger user
fetch('/users/me', { headers: authH() })
.then(function(r) { return r.json(); })
.then(function(u) {
  currentUser = u;
  var ini = ((u.prenom||'?')[0]+(u.nom||'?')[0]).toUpperCase();
  var sa  = document.getElementById('sidebarAvatar');
  if (u.photo) sa.innerHTML = '<img src="'+u.photo+'" alt="av">';
  else sa.textContent = ini;
  document.getElementById('sidebarName').textContent = (u.prenom||'')+' '+(u.nom||'');
  document.getElementById('sidebarRole').textContent = (u.niveau||'')+' – '+(u.filiere||'');
});

// ── Charger conversations ──────────────────────────────────
function loadConversations() {
  fetch('/matching/mes-conversations', { headers: authH() })
  .then(function(r) { return r.json(); })
  .then(function(list) {
    var div = document.getElementById('convList');
    if (!list.length) {
      div.innerHTML = '<div class="no-conv">'
        + '<i class="bi bi-chat-square-dots" style="font-size:2.5rem;opacity:.25;margin-bottom:.5rem"></i>'
        + '<span style="font-size:.85rem">Aucune conversation active.</span>'
        + '<a href="/matching" style="font-size:.82rem;color:#7c3aed;margin-top:.25rem">Trouver des mentors →</a>'
        + '</div>';
      return;
    }

    div.innerHTML = list.map(function(c) {
      var p   = c.partenaire;
      var ini = ((p.prenom||'?')[0]+(p.nom||'?')[0]).toUpperCase();
      var av  = p.photo
        ? '<img src="'+p.photo+'" alt="av">'
        : ini;
      var active = (currentConvId === c.id_conversation) ? ' active' : '';
      return '<div class="conv-item'+active+'" data-id="'+c.id_conversation+'" '
        + 'data-name="'+esc(p.prenom)+' '+esc(p.nom)+'" '
        + 'data-sub="'+esc(p.niveau||'')+' – '+esc(p.filiere||'')+'" '
        + 'data-photo="'+(p.photo||'')+'">'
        + '<div class="conv-avatar">'+av+'</div>'
        + '<div><div class="conv-name">'+esc(p.prenom)+' '+esc(p.nom)+'</div>'
        + '<div class="conv-sub">'+esc(p.niveau||'')+' – '+esc(p.filiere||'')+'</div></div>'
        + '</div>';
    }).join('');

    // Attacher les clics
    div.querySelectorAll('.conv-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var id    = parseInt(item.dataset.id);
        var name  = item.dataset.name;
        var sub   = item.dataset.sub;
        var photo = item.dataset.photo;
        openConversation(id, name, sub, photo);
      });
    });

    // Rouvrir la conv active si elle existe
    if (currentConvId) {
      var active = div.querySelector('[data-id="'+currentConvId+'"]');
      if (active) active.classList.add('active');
    }
  });
}

// ── Ouvrir une conversation ────────────────────────────────
function openConversation(convId, name, sub, photo) {
  currentConvId = convId;
  lastMsgId     = 0;
  if (pollTimer) clearInterval(pollTimer);

  // Header
  var av = document.getElementById('chatAvatar');
  if (photo) av.innerHTML = '<img src="'+photo+'" alt="av">';
  else av.textContent = (name||'?').substring(0,2).toUpperCase();
  document.getElementById('chatName').textContent = name||'Conversation';
  document.getElementById('chatSub').textContent  = sub||'';

  // Afficher la zone
  document.getElementById('chatHeader').style.display  = 'flex';
  document.getElementById('chatMessages').style.display = 'flex';
  document.getElementById('chatFooter').style.display   = 'flex';
  document.getElementById('chatEmpty').style.display    = 'none';

  // Marquer actif dans la liste
  document.querySelectorAll('.conv-item').forEach(function(i) { i.classList.remove('active'); });
  var activeItem = document.querySelector('.conv-item[data-id="'+convId+'"]');
  if (activeItem) activeItem.classList.add('active');

  // Charger messages
  loadMessages();
  pollTimer = setInterval(loadMessages, 3000);

  // Focus input
  document.getElementById('msgInput').focus();
}

// ── Charger messages ────────────────────────────────────────
function loadMessages() {
  if (!currentConvId) return;
  fetch('/messages/' + currentConvId, { headers: authH() })
  .then(function(r) {
    if (!r.ok) return null;
    return r.json();
  })
  .then(function(msgs) {
    if (!msgs || !msgs.length) return;
    if (msgs[msgs.length-1].id_message === lastMsgId) return; // rien de nouveau
    lastMsgId = msgs[msgs.length-1].id_message;

    var box     = document.getElementById('chatMessages');
    var atBottom = (box.scrollHeight - box.scrollTop) <= (box.clientHeight + 80);

    box.innerHTML = msgs.map(function(m) {
      var isMe = currentUser && (m.expediteur_id === currentUser.id_user);
      var time = new Date(m.date_envoi).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
      return '<div style="display:flex;justify-content:'+(isMe?'flex-end':'flex-start')+';margin-bottom:4px">'
        + '<div class="bubble '+(isMe?'me':'other')+'">'
        + esc(m.contenu)
        + '<div class="bubble-time">'+time+'</div>'
        + '</div></div>';
    }).join('');

    if (atBottom || lastMsgId <= msgs[0].id_message) {
      box.scrollTop = box.scrollHeight;
    }
  });
}

// ── Envoyer un message ──────────────────────────────────────
function sendMessage() {
  var input   = document.getElementById('msgInput');
  var btnSend = document.getElementById('btnSend');
  var contenu = input.value.trim();

  if (!contenu || !currentConvId) return;

  // Désactiver pendant l'envoi
  input.disabled    = true;
  btnSend.disabled  = true;
  input.value       = '';

  fetch('/messages/' + currentConvId, {
    method: 'POST',
    headers: authH(),
    body: JSON.stringify({ contenu: contenu })
  })
  .then(function(r) {
    input.disabled   = false;
    btnSend.disabled = false;
    input.focus();
    if (r.ok) {
      lastMsgId = 0; // forcer rechargement
      loadMessages();
    } else {
      input.value = contenu; // remettre le message si erreur
      r.json().then(function(d) {
        alert('Erreur envoi : ' + (d.error||'Inconnu'));
      });
    }
  })
  .catch(function(e) {
    input.disabled   = false;
    btnSend.disabled = false;
    input.value = contenu;
    alert('Erreur réseau : ' + e.message);
  });
}

document.getElementById('btnSend').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Initialisation ──────────────────────────────────────────
loadConversations();

// Recharger la liste de convs toutes les 10s
setInterval(loadConversations, 10000);

// Ouvrir une conv depuis URL (?conv=ID)
var urlConvId = new URLSearchParams(window.location.search).get('conv');
if (urlConvId) {
  // Attendre que la liste soit chargée
  setTimeout(function() {
    var item = document.querySelector('.conv-item[data-id="'+urlConvId+'"]');
    if (item) item.click();
  }, 1500);
}
</script>
</body>
</html>
