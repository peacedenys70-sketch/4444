<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRI MentorLink – Annonces</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/annonces.css') }}" />
  <style>
    .skill-tag{display:inline-block;padding:.35em .85em;border-radius:999px;border:2px solid #7c3aed;color:#7c3aed;font-size:.8rem;cursor:pointer;user-select:none;transition:all .15s;background:#fff}
    .skill-tag.active{background:#7c3aed;color:#fff}
    .skill-tag:hover:not(.active){background:#ede9fe}
    .sidebar-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .author-avatar{width:32px;height:32px;border-radius:50%;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7c3aed;font-size:.73rem;flex-shrink:0;overflow:hidden}
    .author-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <a href="/dashboard" class="sidebar-logo">
      <img src="/static/img/logo-mentorlink.png" alt="IFRI MentorLink" style="width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0">
      <div><div class="sidebar-logo-text">IFRI MentorLink</div><div class="sidebar-logo-sub">UAC – Bénin</div></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Menu</div>
      <a href="/dashboard" class="nav-item-link"><i class="bi bi-grid-1x2 nav-icon"></i> Tableau de bord</a>
      <a href="/annonces"  class="nav-item-link active"><i class="bi bi-megaphone nav-icon"></i> Annonces</a>
      <div class="sidebar-section-label">Social</div>
      <a href="/messages"  class="nav-item-link"><i class="bi bi-chat-dots nav-icon"></i> Messagerie</a>
      <a href="/matching"  class="nav-item-link"><i class="bi bi-people nav-icon"></i> Mes matchs</a>
      <a href="/planning"  class="nav-item-link"><i class="bi bi-calendar-week nav-icon"></i> Planning</a>
      <div class="sidebar-section-label">Compte</div>
      <a href="/profil"    class="nav-item-link"><i class="bi bi-person-circle nav-icon"></i> Profil</a>
      <a href="#" id="logoutBtn" class="nav-item-link" style="color:#ef4444"><i class="bi bi-box-arrow-left nav-icon"></i> Déconnexion</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/profil" class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">?</div>
        <div>
          <div class="sidebar-user-name" id="sidebarName">…</div>
          <div class="sidebar-user-role" id="sidebarRole"></div>
        </div>
      </a>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <header class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="topbar-hamburger" id="hamburgerBtn"><i class="bi bi-list"></i></button>
      <span class="topbar-title">Annonces</span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-mentorlink btn-sm" data-bs-toggle="modal" data-bs-target="#modalAnnonce">
        <i class="bi bi-plus-lg me-1"></i>Nouvelle annonce
      </button>
    </div>
  </header>

  <main class="main-content">
    <div id="alertMsg" class="d-none mb-3"></div>
    <div id="annoncesGrid" class="row g-3">
      <div class="col-12 text-center py-5 text-muted">
        <span class="spinner-border spinner-border-sm me-2"></span>Chargement des annonces…
      </div>
    </div>
  </main>

  <!-- Modal nouvelle annonce -->
  <div class="modal fade" id="modalAnnonce" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nouvelle annonce</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalAlert" class="d-none mb-2"></div>
          <div class="mb-3">
            <label class="form-label fw-medium">Titre</label>
            <input type="text" id="anTitre" class="form-control" placeholder="Ex : Aide en Python" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-medium">Description</label>
            <textarea id="anDesc" class="form-control" rows="3" placeholder="Décrivez votre annonce…"></textarea>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-medium">Type</label>
              <select id="anType" class="form-select">
                <option value="OFFRE">Offre (je propose)</option>
                <option value="DEMANDE">Demande (j'ai besoin)</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label fw-medium">Format</label>
              <select id="anFormat" class="form-select">
                <option value="PRESENTIEL">Présentiel</option>
                <option value="EN_LIGNE">En ligne</option>
                <option value="HYBRIDE">Hybride</option>
              </select>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label fw-medium">Compétences concernées</label>
            <div class="d-flex flex-wrap gap-2 mb-2" id="anCompTags">
              <span class="skill-tag" data-val="Python">Python</span>
              <span class="skill-tag" data-val="JavaScript">JavaScript</span>
              <span class="skill-tag" data-val="SQL">SQL</span>
              <span class="skill-tag" data-val="Algorithmique">Algorithmique</span>
              <span class="skill-tag" data-val="Réseaux">Réseaux</span>
              <span class="skill-tag" data-val="Machine Learning">ML</span>
              <span class="skill-tag" data-val="HTML/CSS">HTML/CSS</span>
              <span class="skill-tag" data-val="Linux">Linux</span>
            </div>
            <div class="input-group input-group-sm">
              <input type="text" id="anCompCustom" class="form-control" placeholder="Autre compétence…" />
              <button class="btn btn-outline-secondary" id="btnAddAnComp" type="button"><i class="bi bi-plus"></i></button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-mentorlink" id="btnCreateAnnonce">
            <span id="btnAnnonceText">Publier</span>
            <span id="btnAnnonceSpinner" class="d-none spinner-border spinner-border-sm"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (!localStorage.getItem('access_token')) window.location.href = '/login';

    const authH = () => ({
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${localStorage.getItem('access_token')}`
    });

    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg, type='info') {
      const t = document.createElement('div');
      t.className = `alert alert-${type} position-fixed bottom-0 end-0 m-3`;
      t.style.cssText = 'z-index:9999;min-width:260px;border-radius:12px;font-size:0.88rem';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    document.getElementById('hamburgerBtn').addEventListener('click', () =>
      document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('sidebarOverlay').addEventListener('click', () =>
      document.getElementById('sidebar').classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', e => {
      e.preventDefault(); localStorage.clear(); window.location.href = '/login';
    });

    // Tags compétences dans le modal
    document.querySelectorAll('#anCompTags .skill-tag').forEach(t =>
      t.addEventListener('click', () => t.classList.toggle('active')));

    // Ajouter un tag personnalisé
    document.getElementById('btnAddAnComp').addEventListener('click', () => {
      const val = document.getElementById('anCompCustom').value.trim();
      if (!val) return;
      const container = document.getElementById('anCompTags');
      const existing  = [...container.querySelectorAll('.skill-tag')]
        .find(t => t.dataset.val.toLowerCase() === val.toLowerCase());
      if (existing) { existing.classList.add('active'); }
      else {
        const span = document.createElement('span');
        span.className = 'skill-tag active';
        span.dataset.val = val;
        span.textContent = val;
        span.addEventListener('click', () => span.classList.toggle('active'));
        container.appendChild(span);
      }
      document.getElementById('anCompCustom').value = '';
    });
    document.getElementById('anCompCustom').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btnAddAnComp').click(); }
    });

    // Réinitialiser modal à la fermeture
    document.getElementById('modalAnnonce').addEventListener('hidden.bs.modal', () => {
      document.getElementById('anTitre').value = '';
      document.getElementById('anDesc').value  = '';
      document.getElementById('anType').value  = 'OFFRE';
      document.getElementById('modalAlert').classList.add('d-none');
      document.querySelectorAll('#anCompTags .skill-tag').forEach(t => t.classList.remove('active'));
    });

    // ── Charger les annonces ───────────────────────────────
    let currentUserId = null;

    fetch('/users/me', { headers: authH() }).then(r => r.json()).then(u => {
      currentUserId = u.id_user;
      localStorage.setItem('user', JSON.stringify(u));
      const sa  = document.getElementById('sidebarAvatar');
      const ini = ((u.prenom||'?')[0]+(u.nom||'?')[0]).toUpperCase();
      if (u.photo) sa.innerHTML = `<img src="${u.photo}" alt="avatar">`;
      else sa.textContent = ini;
      document.getElementById('sidebarName').textContent = `${u.prenom} ${u.nom}`;
      document.getElementById('sidebarRole').textContent = `${u.niveau} – ${u.filiere}`;
    });

    async function loadAnnonces() {
      try {
        const res  = await fetch('/annonces/', { headers: authH() });
        const list = await res.json();
        const grid = document.getElementById('annoncesGrid');

        if (!list.length) {
          grid.innerHTML = '<p class="text-center text-muted py-5">Aucune annonce active pour le moment.</p>';
          return;
        }

        grid.innerHTML = list.map(a => `
          <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm" style="border-radius:14px;border-left:4px solid ${a.type_annonce==='OFFRE'?'#7c3aed':'#f59e0b'} !important">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between mb-2">
                  <span class="badge" style="background:${a.type_annonce==='OFFRE'?'#ede9fe':'#fef3c7'};
                    color:${a.type_annonce==='OFFRE'?'#7c3aed':'#d97706'}">${a.type_annonce}</span>
                  <small class="text-muted">${new Date(a.date_creation).toLocaleDateString('fr-FR')}</small>
                </div>
                <h6 class="fw-bold mb-1" style="font-size:0.9rem">${escHtml(a.titre)}</h6>
                <p class="text-muted mb-2" style="font-size:0.82rem;flex-grow:1">${escHtml(a.description.slice(0,100))}${a.description.length>100?'…':''}</p>
                <div class="d-flex flex-wrap gap-1 mb-3">
                  ${(a.competences||[]).map(c => `<span class="badge bg-light text-secondary" style="font-size:0.72rem">${escHtml(c)}</span>`).join('')}
                </div>
                <div class="border-top pt-2 d-flex align-items-center justify-content-between">
                  <div class="d-flex align-items-center gap-2">
                    <div class="author-avatar">
                      ${a.auteur.photo ? `<img src="${a.auteur.photo}" alt="avatar">` : `${escHtml((a.auteur.prenom||'?')[0])}${escHtml((a.auteur.nom||'?')[0])}`}
                    </div>
                    <div>
                      <div style="font-size:0.78rem;font-weight:600">${escHtml(a.auteur.prenom)} ${escHtml(a.auteur.nom)}</div>
                      <div style="font-size:0.7rem;color:#6b7280">${escHtml(a.auteur.niveau)} – ${escHtml(a.auteur.filiere)}</div>
                    </div>
                  </div>
                  ${a.auteur.id_user !== currentUserId ? `
                    <button class="btn btn-sm btn-mentorlink" onclick="demanderMatch(${a.auteur.id_user},'${escHtml(a.auteur.prenom)} ${escHtml(a.auteur.nom)}')"
                      style="font-size:0.75rem;padding:.3rem .75rem;border-radius:999px">
                      <i class="bi bi-person-plus me-1"></i>Matcher
                    </button>` :
                    `<span class="badge bg-secondary" style="font-size:0.7rem">Mon annonce</span>`}
                </div>
              </div>
            </div>
          </div>`).join('');
      } catch(e) {
        document.getElementById('annoncesGrid').innerHTML =
          '<p class="text-center text-muted py-5">Erreur lors du chargement des annonces.</p>';
      }
    }

    // ── Créer une annonce ──────────────────────────────────
    document.getElementById('btnCreateAnnonce').addEventListener('click', async () => {
      const titre   = document.getElementById('anTitre').value.trim();
      const desc    = document.getElementById('anDesc').value.trim();
      const type    = document.getElementById('anType').value;
      const fmt     = document.getElementById('anFormat').value;
      const comps   = [...document.querySelectorAll('#anCompTags .skill-tag.active')].map(t => t.dataset.val);
      const alertEl = document.getElementById('modalAlert');

      if (!titre || !desc) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = 'Titre et description sont obligatoires.';
        alertEl.classList.remove('d-none');
        return;
      }

      document.getElementById('btnAnnonceText').classList.add('d-none');
      document.getElementById('btnAnnonceSpinner').classList.remove('d-none');

      try {
        const res = await fetch('/annonces/', {
          method: 'POST', headers: authH(),
          body: JSON.stringify({ titre, description: desc, type_annonce: type, format: fmt, competences: comps })
        });
        const data = await res.json();
        if (res.ok) {
          bootstrap.Modal.getInstance(document.getElementById('modalAnnonce')).hide();
          showToast('✅ Annonce publiée !', 'success');
          loadAnnonces();
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = data.error || 'Erreur lors de la publication.';
          alertEl.classList.remove('d-none');
        }
      } catch(e) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = 'Erreur réseau.';
        alertEl.classList.remove('d-none');
      } finally {
        document.getElementById('btnAnnonceText').classList.remove('d-none');
        document.getElementById('btnAnnonceSpinner').classList.add('d-none');
      }
    });

    // ── Demander un match depuis une annonce ───────────────
    async function demanderMatch(mentorId, nom) {
      if (!confirm(`Envoyer une demande de mentoring à ${nom} ?`)) return;
      try {
        const res  = await fetch('/matching/', {
          method: 'POST', headers: authH(),
          body: JSON.stringify({ mentor_id: mentorId })
        });
        const data = await res.json();
        if (res.ok) showToast(`✅ Demande envoyée à ${nom} !`, 'success');
        else if (res.status === 409) showToast('Une demande existe déjà avec cet utilisateur.', 'warning');
        else showToast(data.error || 'Erreur.', 'danger');
      } catch(e) { showToast('Erreur réseau.', 'danger'); }
    }

    loadAnnonces();
  </script>
</body>
</html>
